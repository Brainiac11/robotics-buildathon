[project]
name = "buildathon-host"
version = "0.1.0"
description = "Robot host: protocol server and safety layer with sim, real and mock backends."
requires-python = ">=3.12"
dependencies = ["buildathon", "pyzmq>=26", "numpy>=1.26", "opencv-python-headless>=4.9", "pyyaml>=6"]

[project.optional-dependencies]
sim = ["mujoco==3.3.7"]
# Real robot only (Raspberry Pi). Install torch from the CPU index first; see docker/Dockerfile.host-real.
real = ["lerobot[lekiwi]==0.7.0"]

[project.scripts]
buildathon-host = "buildathon_host.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buildathon_host"]
