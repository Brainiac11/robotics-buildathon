[project]
name = "buildathon"
version = "0.1.0"
description = "Participant SDK for the Build-a-thon SO-101 vehicle (sim and real robot)."
requires-python = ">=3.10"
dependencies = ["pyzmq>=26", "numpy>=1.26", "opencv-python-headless>=4.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buildathon"]
