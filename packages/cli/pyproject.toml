[project]
name = "buildathon-cli"
version = "0.1.0"
description = "The `robot` command: run the sim, run apps, gate them, talk to the robot."
requires-python = ">=3.12"
dependencies = ["buildathon", "pyyaml>=6"]

[project.scripts]
robot = "buildathon_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buildathon_cli"]
